server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer 需要跨域隔离 —— input() 的阻塞式实现全靠它。
    # 少了这两行，猜数字这类要打字的项目就跑不起来。
    add_header Cross-Origin-Opener-Policy   same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # wasm 要正确的 MIME，否则浏览器拒绝流式编译
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;   # 作品截图是 dataURL，会有点大

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Pyodide 运行时体积大且永不变，长缓存
    location /pyodide/ {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # 课程用的 Python 脚本改动频繁，不缓存
    location /py/ {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
